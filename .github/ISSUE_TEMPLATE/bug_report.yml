name: Bug report
description: Report a defect in Atelier (capability, skill, component, policy, recipe, runtime, compiler, or tooling).
title: '[Bug] '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report.

        Before submitting: please search existing issues to avoid duplicates,
        and review [`AGENTS.md`](../blob/main/AGENTS.md) for which artifact
        category your bug likely belongs to.

        For security vulnerabilities, do **not** use this form. Follow the
        process in [`SECURITY.md`](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the actual behaviour.
      placeholder: When I do X, the renderer returns Y instead of Z…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: A clear and concise description of the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce the bug. Include code, manifests, or commands where possible.
      placeholder: |
        1. Run `pnpm …`
        2. Provide intent `{ … }`
        3. Observe manifest output …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions and OS where the bug was observed.
      value: |
        - Node version: (output of `node --version`)
        - pnpm version: (output of `pnpm --version`)
        - OS / version:
        - Atelier commit / version:
      render: markdown
    validations:
      required: true
  - type: input
    id: manifest-id
    attributes:
      label: manifest_id (if applicable)
      description: If a generated UI manifest is involved, paste its `manifest_id` so we can locate it in the audit log.
      placeholder: e.g. mfst_01HZX…
    validations:
      required: false
  - type: textarea
    id: audit-log
    attributes:
      label: Audit log excerpt (if applicable)
      description: Paste the relevant lines from the compiler / runtime audit log. Redact anything sensitive.
      render: text
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, related issues, hypotheses about the root cause, etc.
    validations:
      required: false
