name: Capability proposal (RFC)
description: Propose a brand-new CIR capability (action or data). Becomes an RFC for review.
title: '[Capability] '
labels: ['capability', 'rfc']
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose a **new capability** in the CIR registry.

        Read [`AGENTS.md`](../blob/main/AGENTS.md) → "When asked to add a
        capability" and [`ETHOS.md`](../blob/main/ETHOS.md) before filing.
        A capability is the public, versioned contract — adding one is a
        long-term commitment.

        For changes to an existing capability, use the
        [Feature request](./new?template=feature_request.yml) template.
  - type: input
    id: name
    attributes:
      label: Capability name
      description: 'Fully-qualified name, e.g. `calendar.create_event` or `mail.list_threads`.'
      placeholder: domain.action_name
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      description: Is this an action (causes a side effect) or a data capability (reads / queries)?
      options:
        - action
        - data
    validations:
      required: true
  - type: textarea
    id: input-schema
    attributes:
      label: Input schema sketch
      description: JSON Schema sketch of the input. Doesn't need to be final — fields, types, required vs optional.
      render: json
      placeholder: |
        {
          "type": "object",
          "properties": {
            "title": { "type": "string" }
          },
          "required": ["title"]
        }
    validations:
      required: true
  - type: textarea
    id: output-schema
    attributes:
      label: Output schema sketch
      description: JSON Schema sketch of what the capability returns.
      render: json
    validations:
      required: true
  - type: textarea
    id: side-effects
    attributes:
      label: side_effects
      description: |
        Honest enumeration. What state changes outside the system as a
        result of invoking this? (e.g. "creates a calendar event in the
        user's default calendar", "sends an email to N recipients",
        "none — read only".)
    validations:
      required: true
  - type: textarea
    id: permissions
    attributes:
      label: Permissions needed
      description: Which user-granted permissions / scopes are required to invoke this?
      placeholder: e.g. calendar.write, contacts.read
    validations:
      required: true
  - type: dropdown
    id: reversibility
    attributes:
      label: Reversibility
      description: Can the effect be undone, and how?
      options:
        - reversible (single-call undo available)
        - reversible (manual undo path documented)
        - irreversible (one-way action — confirmation required)
    validations:
      required: true
  - type: textarea
    id: not-covered
    attributes:
      label: Why isn't this covered by an existing capability?
      description: |
        Survey the current `/capabilities/` registry. If something is close
        but not quite right, explain why a new capability is justified
        rather than extending the existing one (which would need a
        version bump and migration).
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to related RFCs, prior art in other systems, eval cases you'd add.
    validations:
      required: false
