name: marketplace-eval-llm

# Sprint 2.1 — daily real-LLM marketplace eval. Compiles the top-N currently-
# approved personas via REAL Gemini (`gemini-2.5-flash` by default), records
# per-persona token + cost telemetry, and gates on three week-over-week
# regressions:
#
#   1. compile pass-rate drops below 95% WoW
#   2. p95 cost-per-persona doubles WoW
#   3. any persona's manifest_shape_hash changes from the most recent
#      committed report
#
# Runs at 04:30 UTC daily — 30 minutes after the deterministic `marketplace-eval`
# at 04:00 UTC, so the regression bucket is "real-LLM only" and not contaminated
# by deterministic-compile drift.

on:
  schedule:
    - cron: '30 4 * * *' # 04:30 UTC daily
  workflow_dispatch:

concurrency:
  group: marketplace-eval-llm
  cancel-in-progress: false

permissions:
  contents: write # commit the regenerated dashboard MDX + the new report
  issues: write # post the report as a comment on the tracking issue

jobs:
  eval:
    name: Marketplace eval (real LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_COLD_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need the full history so the bot commit doesn't conflict
          # with the regenerated dashboard MDX path.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (dist/ artifacts)
        # Every @atelier/* package now ships from dist/ (Sprint 1.4 lockstep
        # release flip). The eval runner imports @atelier/eval-marketplace,
        # @atelier/compiler, etc., from dist/index.js — without this step the
        # workspace symlinks resolve to a non-existent path and bin shims
        # fail to wire (atelier-schemas / atelier-evals / atelier).
        #
        # Filter to `./packages/*` only — `pnpm build` (== `pnpm -r --if-present
        # build`) would also try to build apps/docs, which requires the
        # rehype-mermaid Playwright chromium that this workflow doesn't
        # install (and shouldn't, for a 25-min eval gate).
        # `--workspace-concurrency=1` enforces topological-order sequential
        # builds so @atelier/react doesn't typecheck against @atelier/components
        # /dist/ before that dist/ is emitted (parallel race seen on
        # workflow-dispatch run 25374851734 — react TS2307 on
        # `@atelier/components/_variants` and `/density-resolver`).
        run: pnpm -r --filter "./packages/*" --if-present --workspace-concurrency=1 build

      - name: Verify GEMINI_API_KEY is configured
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Gemini key present (length: ${#GEMINI_API_KEY})."

      - name: Compute report path
        id: paths
        run: |
          DATE=$(date -u +%Y-%m-%d)
          REPORT_PATH="eval-reports/marketplace-llm-${DATE}.json"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

      - name: Run marketplace eval (real LLM)
        run: |
          pnpm marketplace:eval \
            --vault-url "${MARKETPLACE_VAULT_URL:-https://vault.example.invalid}" \
            --top 10 \
            --mode real-llm \
            --llm-model "${GEMINI_COLD_MODEL}" \
            --out "${{ steps.paths.outputs.report_path }}"
        env:
          MARKETPLACE_VAULT_URL: ${{ secrets.MARKETPLACE_VAULT_URL }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-eval-llm-${{ steps.paths.outputs.date }}
          path: ${{ steps.paths.outputs.report_path }}
          retention-days: 90

      - name: Evaluate week-over-week gates
        id: wow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const reportPath = '${{ steps.paths.outputs.report_path }}';
            if (!fs.existsSync(reportPath)) {
              core.warning(`report ${reportPath} not present — skipping WoW gates`);
              core.setOutput('passed', 'false');
              core.setOutput('failure_reasons', JSON.stringify(['report file missing']));
              return;
            }
            const current = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            // Walk eval-reports/ for prior LLM runs and pick the
            // 7-day-old baseline (closest to 7 days before the
            // current run, falling back to the oldest available).
            const dir = 'eval-reports';
            const files = fs
              .readdirSync(dir)
              .filter((f) => f.startsWith('marketplace-llm-') && f.endsWith('.json'))
              .map((f) => path.join(dir, f));
            const priors = [];
            for (const f of files) {
              if (path.basename(f) === path.basename(reportPath)) continue;
              try {
                priors.push(JSON.parse(fs.readFileSync(f, 'utf8')));
              } catch (err) {
                core.warning(`could not parse ${f}: ${err.message}`);
              }
            }
            priors.sort((a, b) => a.generated_at.localeCompare(b.generated_at));

            const now = Date.parse(current.generated_at);
            const weekAgoCutoff = now - 7 * 24 * 60 * 60 * 1000;
            // Closest report ≥ 7 days ago, else the oldest.
            const weekOld =
              [...priors].reverse().find((r) => Date.parse(r.generated_at) <= weekAgoCutoff) ??
              priors[0] ??
              null;

            const failures = [];

            // Gate 1: compile pass-rate drops below 95% WoW.
            const currentPassRate =
              current.summary.total === 0 ? 1 : current.summary.passed / current.summary.total;
            if (currentPassRate < 0.95) {
              failures.push(`pass rate ${(currentPassRate * 100).toFixed(1)}% < 95% absolute`);
            }
            if (weekOld !== null) {
              const oldPassRate =
                weekOld.summary.total === 0
                  ? 1
                  : weekOld.summary.passed / weekOld.summary.total;
              if (oldPassRate >= 0.95 && currentPassRate < 0.95) {
                failures.push(
                  `pass rate dropped ${(oldPassRate * 100).toFixed(1)}% → ${(currentPassRate * 100).toFixed(1)}% WoW`,
                );
              }
            }

            // Gate 2: p95 cost-per-persona doubles WoW.
            if (weekOld !== null) {
              const oldP95 = weekOld.summary.cost_per_persona_p95_usd ?? 0;
              const newP95 = current.summary.cost_per_persona_p95_usd ?? 0;
              if (oldP95 > 0 && newP95 >= oldP95 * 2) {
                failures.push(
                  `p95 cost doubled WoW: ${oldP95.toFixed(4)} USD → ${newP95.toFixed(4)} USD`,
                );
              }
            }

            // Gate 3: persona shape-hash drift vs. baseline (latest prior run).
            const baseline = priors[priors.length - 1] ?? null;
            const driftedPersonas = [];
            if (baseline !== null) {
              const baselineHashes = new Map();
              for (const p of baseline.personas) {
                if (p.llm?.manifest_shape_hash) {
                  baselineHashes.set(p.address, p.llm.manifest_shape_hash);
                }
              }
              for (const p of current.personas) {
                const prevHash = baselineHashes.get(p.address);
                const newHash = p.llm?.manifest_shape_hash;
                if (
                  prevHash !== undefined &&
                  newHash !== undefined &&
                  prevHash !== newHash
                ) {
                  driftedPersonas.push({
                    address: p.address,
                    prev: prevHash,
                    next: newHash,
                  });
                }
              }
              if (driftedPersonas.length > 0) {
                failures.push(
                  `${driftedPersonas.length} persona(s) shape-hash drifted from baseline`,
                );
              }
            }

            core.setOutput('drifted_personas', JSON.stringify(driftedPersonas));
            core.setOutput('failure_reasons', JSON.stringify(failures));
            core.setOutput('passed', failures.length === 0 ? 'true' : 'false');
            if (failures.length > 0) {
              core.warning(`WoW gates: ${failures.join('; ')}`);
            } else {
              core.info('WoW gates: all clean');
            }

      - name: Regenerate cost dashboard
        if: always()
        run: pnpm marketplace-cost-dashboard

      - name: Commit dashboard + report (success path)
        if: success() && steps.wow.outputs.passed == 'true'
        run: |
          git config user.name 'atelier-eval-bot'
          git config user.email 'eval-bot@users.noreply.github.com'
          git add "${{ steps.paths.outputs.report_path }}" \
            eval-reports/cost-dashboard.json \
            apps/docs/src/content/docs/operations/cost-dashboard.mdx
          if git diff --cached --quiet; then
            echo "no dashboard changes to commit"
          else
            git commit -m "chore(evals): nightly LLM eval report ${{ steps.paths.outputs.date }} + regenerated cost dashboard"
            git push origin HEAD:main
          fi

      - name: Post tracking issue with the report (always)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = '${{ steps.paths.outputs.report_path }}';
            let report;
            try {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } catch (err) {
              core.warning(`could not read report: ${err.message}`);
              return;
            }
            const summary = report.summary;
            const failures = JSON.parse('${{ steps.wow.outputs.failure_reasons }}' || '[]');
            const drifted = JSON.parse(
              '${{ steps.wow.outputs.drifted_personas }}' || '[]',
            );
            const lines = [
              '## Marketplace LLM eval — daily report',
              '',
              `Run: \`${report.generated_at}\``,
              `Compiler: \`${report.reference_versions.compiler_version}\``,
              '',
              `**Summary:** ${summary.passed} passed, ${summary.failed} failed, ` +
                `${summary.skipped} skipped (${summary.duration_ms}ms)`,
            ];
            if (summary.total_cost_usd !== undefined) {
              lines.push('');
              lines.push(`**Cost:** $${summary.total_cost_usd.toFixed(4)} total | ` +
                `avg $${(summary.cost_per_persona_avg_usd ?? 0).toFixed(4)} per persona | ` +
                `p95 $${(summary.cost_per_persona_p95_usd ?? 0).toFixed(4)}`);
              lines.push(`**Tokens:** ${summary.total_tokens_input} input, ${summary.total_tokens_output} output ` +
                `(pricing revision: \`${summary.pricing_revision ?? 'unknown'}\`)`);
            }
            if (failures.length > 0) {
              lines.push('');
              lines.push('### Week-over-week gates failing');
              lines.push('');
              for (const f of failures) lines.push(`- ${f}`);
            }
            if (drifted.length > 0) {
              lines.push('');
              lines.push('### Manifest shape drift (separately reportable)');
              lines.push('');
              for (const d of drifted) {
                lines.push(`- \`${d.address}\`: \`${d.prev.slice(0, 12)}\` → \`${d.next.slice(0, 12)}\``);
              }
            }
            lines.push('');
            lines.push(`Full report artifact: \`marketplace-eval-llm-${'${{ steps.paths.outputs.date }}'}\` on this run.`);
            const body = lines.join('\n');
            const title = `[marketplace-eval-llm] daily report ${report.generated_at.slice(0, 10)}`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'marketplace-eval-llm',
              per_page: 10,
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
              core.info(`commented on issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['marketplace-eval-llm'],
              });
              core.info(`opened issue #${created.data.number}`);
            }

      - name: Fail the run when WoW gates trip
        if: steps.wow.outputs.passed != 'true'
        run: |
          echo "::error::Marketplace LLM eval WoW gates failed: ${{ steps.wow.outputs.failure_reasons }}"
          exit 1
