name: Atelier V2.3 acceptance
on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - '.github/workflows/atelier-v23-acceptance.yml'
  pull_request:
    paths: ['platform/**', '.github/workflows/atelier-v23-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier-v23-${{ github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: platform/requirements-browser.txt
      - name: Install exact dependencies and Chromium
        working-directory: platform
        run: |
          npm ci
          python -m pip install --requirement requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Canonical core acceptance
        working-directory: platform
        env:
          ATELIER_PYTHON: python
        run: npm run acceptance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atelier-v23-acceptance-${{ github.sha }}
          path: platform/evidence/current/acceptance
          retention-days: 14
          if-no-files-found: error
