name: Atelier reconstruction toolchain
on:
  push:
    branches: [feat/v2-reconstruction-artifact-agents]
    paths: ['.github/workflows/atelier-toolchain.yml']
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Resolve and test pinned build dependencies
        shell: bash
        run: |
          mkdir toolchain && cd toolchain
          printf '{"name":"atelier-verification-toolchain","version":"1.0.0","private":true,"type":"module"}\n' > package.json
          npm install --save-exact --ignore-scripts --no-audit --no-fund react@19.2.8 react-dom@19.2.8 @types/react@19.2.0 @types/react-dom@19.2.0 typescript@5.7.3 esbuild@0.28.2 ajv@8.17.1 ajv-formats@3.0.1 postcss@8.5.6 playwright-core@1.55.0
          node --input-type=module -e "import {build} from 'esbuild'; import React from 'react'; await build({stdin:{contents:'export const ok = true'},write:false}); console.log('React',React.version,'esbuild passed')"
          tar -czf ../atelier-toolchain-linux-x64.tar.gz package.json package-lock.json node_modules
          cd ..
          sha256sum atelier-toolchain-linux-x64.tar.gz > atelier-toolchain-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atelier-toolchain-linux-x64
          path: |
            atelier-toolchain-linux-x64.tar.gz
            atelier-toolchain-linux-x64.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
