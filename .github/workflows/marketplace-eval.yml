name: marketplace-eval

# V-6.e — nightly marketplace eval gate. Walks the top-N currently-approved
# personas, compiles them against a frozen reference set, validates the
# result against `ManifestSchema` + the baseline policies in
# `@atelier/policies`, and uploads a 90-day JSON report. On regression,
# auto-opens an issue with the report excerpt so a human picks it up.

on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch:

concurrency:
  group: marketplace-eval
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # auto-open / update the regression issue

jobs:
  eval:
    name: Marketplace eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run marketplace eval gate
        # When MARKETPLACE_VAULT_URL isn't configured we fall through to the
        # documented placeholder. The CLI's stub-mode path handles a
        # missing/404 listing endpoint cleanly: report has 0 personas + exits 0.
        run: |
          pnpm marketplace:eval \
            --vault-url "${MARKETPLACE_VAULT_URL:-https://vault.example.invalid}" \
            --top 10 \
            --out eval-results/marketplace.json
        env:
          MARKETPLACE_VAULT_URL: ${{ secrets.MARKETPLACE_VAULT_URL }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-eval
          path: eval-results/marketplace.json
          retention-days: 90

      - name: Open / update issue on regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(
                fs.readFileSync('eval-results/marketplace.json', 'utf8'),
              );
            } catch (err) {
              core.warning(`could not read report: ${err.message}`);
              return;
            }
            const failed = report.personas.filter(
              (p) => p.status === 'failed',
            );
            if (failed.length === 0) {
              core.info('no failed personas — nothing to file');
              return;
            }
            const title = `[marketplace-eval] ${failed.length} persona regression(s) on ${report.generated_at.slice(0, 10)}`;
            const lines = [
              '## Marketplace eval gate — regression detected',
              '',
              `Generated: \`${report.generated_at}\`  `,
              `Reference: \`compiler=${report.reference_versions.compiler_version}\` | ` +
                `\`capabilities=${report.reference_versions.capabilities_hash.slice(0, 12)}\` | ` +
                `\`components=${report.reference_versions.components_hash.slice(0, 12)}\``,
              '',
              `**Summary:** ${report.summary.passed} passed, ` +
                `${report.summary.failed} failed, ` +
                `${report.summary.skipped} skipped ` +
                `(${report.summary.duration_ms}ms)`,
              '',
              '### Failed personas',
              '',
            ];
            for (const p of failed) {
              lines.push(`- **${p.address}** — ${(p.violations || []).length} violation(s)`);
              for (const v of (p.violations || []).slice(0, 5)) {
                lines.push(
                  `  - \`${v.rule}\` (${v.severity})${v.route ? ` on \`${v.route}\`` : ''}: ${v.message}`,
                );
              }
            }
            lines.push('');
            lines.push(
              `Full report: see the \`marketplace-eval\` artifact on this run.`,
            );
            const body = lines.join('\n');
            // Look for an existing open issue with our marker label and
            // update it instead of opening a new one each night.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'marketplace-eval',
              per_page: 10,
            });
            if (existing.data.length > 0) {
              const issue = existing.data[0];
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title,
                body,
              });
              core.info(`updated issue #${issue.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['marketplace-eval'],
              });
              core.info(`opened issue #${created.data.number}`);
            }
