name: Nightly Evals (real Gemini)

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

concurrency:
  group: nightly-evals
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: Real-Gemini smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_COLD_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify GEMINI_API_KEY is configured
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured. Add it under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Gemini key present (length: ${#GEMINI_API_KEY})."

      - name: Run smoke evals
        run: pnpm exec atelier-evals run --tag smoke

      - name: Surface result
        if: failure()
        run: echo "::warning::Nightly Gemini smoke failed. Check the run output for the specific failure (auth, timeout, schema, policies)."
