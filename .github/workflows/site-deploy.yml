name: site-deploy

# Builds the @atelier/docs Starlight site and deploys it to GitHub Pages.
#
# After the P3 marketing+docs merge (2026-05-04), this is a single-site
# deploy. The Starlight site at `apps/docs/` serves both the marketing
# splash pages (`/`, `/start/`, `/architecture/`, `/demos/`) and the
# developer docs (sidebar-rendered sections under `/introduction/`,
# `/getting-started/`, `/concepts/`, `/compiler/`, `/components/`,
# `/marketplace/`, `/runtime/`, `/operations/`, plus `/roadmap/`,
# `/glossary/`, `/contributing/`).
#
# REQUIRES (one-time, repo-owner action):
#   Settings → Pages → Source: "GitHub Actions"
# Until that toggle is flipped, the deploy step will fail with a clear
# message from actions/configure-pages — the build step still runs, so
# PRs get build-time validation regardless.

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium (for rehype-mermaid SVG render)
        # rehype-mermaid's `inline-svg` strategy renders mermaid → SVG via a
        # headless chromium at build time. Without this step the docs build
        # fails with "Executable doesn't exist at .../chrome-headless-shell".
        run: pnpm --filter @atelier/docs exec playwright install --with-deps chromium

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build docs site
        env:
          # configure-pages sets `base_path` to the Pages base
          # (e.g. /atelier on fragmatic-io.github.io/atelier, or / for a
          # custom domain). The docs site now lives at the root of that
          # base — there is no longer a separate marketing layer above.
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
        run: pnpm --filter @atelier/docs build

      - name: Stage artifact
        run: |
          mkdir -p _site
          cp -r apps/docs/dist/. _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
