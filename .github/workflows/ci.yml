name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @atelier/docs exec playwright install --with-deps chromium

      # Build every workspace package/app that declares a build script. Core
      # package exports now resolve through dist artifacts, so this catches
      # broken package.json export maps and production-only Next.js failures
      # before typecheck/test run against a half-built workspace.
      - name: Build packages and apps
        run: pnpm build

      - name: License headers
        run: pnpm check:license-headers

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate data
        run: pnpm validate:data

      - name: Schemas — AJV strict-mode gate
        run: pnpm schemas:check-ajv

      - name: Components catalog check
        run: pnpm components:check

      - name: Capabilities index check
        run: pnpm capabilities:index:check

      - name: Test (with coverage)
        run: pnpm test --coverage

      # Pack @atelier/schemas, install into a scratch dir as a downstream npm
      # consumer would, and run workspace dist/bin smokes for the migrated core
      # packages. Gates the merge so broken package artifacts can't reach main.
      - name: Smoke-test package artifacts
        run: pnpm smoke-test:pack

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # TODO P0.1 — production-readiness fresh-clone guardrail.
  # The split-step `validate` job above gives nice per-step CI annotations.
  # This separate one-shot job runs the *unified* `pnpm validate` script
  # exactly as a fresh-clone consumer would invoke it. If CI passes the
  # split steps but fails this job, an advertised command is broken even
  # though component pieces succeed individually — that's the bug we're
  # guarding against (per the 2026-05-04 external review).
  validate-fresh-clone:
    name: Validate (fresh clone, unified pnpm validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @atelier/docs exec playwright install --with-deps chromium

      - name: Run advertised validate command
        # `pnpm validate` is the script users + agents actually run. A green
        # CI must mean a green `pnpm validate` on a fresh clone. Its first
        # step is the same recursive artifact build used above.
        run: pnpm validate

      - name: Smoke-test package artifacts
        run: pnpm smoke-test:pack

  demo-e2e:
    name: Demo Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @atelier/docs exec playwright install --with-deps chromium

      - name: Build package artifacts
        run: pnpm build

      - name: Verify demo Playwright browser
        run: pnpm --filter @atelier/demo exec playwright install --with-deps chromium

      - name: Run demo E2E
        run: pnpm --filter @atelier/demo e2e
