name: marketing-deploy

# Builds the @atelier/marketing Astro site and deploys it to GitHub Pages.
#
# REQUIRES (one-time, repo-owner action):
#   Settings → Pages → Source: "GitHub Actions"
# Until that toggle is flipped, the deploy step will fail with a clear
# message from actions/configure-pages — the build steps still run, so
# PRs get build-time validation regardless.

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build marketing site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          # `actions/configure-pages` sets `base_path` to the project's Pages
          # base (e.g. /atelier for fragmatic-io.github.io/atelier, or / for a
          # custom domain). Pass it through so Astro emits matching absolute URLs.
          MARKETING_BASE: ${{ steps.pages.outputs.base_path }}
          MARKETING_SITE: ${{ steps.pages.outputs.origin }}
        run: pnpm --filter @atelier/marketing build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/marketing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
