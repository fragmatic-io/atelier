name: Recover saved Atelier source tree
on:
  push:
    branches: [feat/v2-reconstruction-artifact-agents]
    paths: ['.github/workflows/atelier-recover-saved-source-tree.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atelier-source-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'fragmatic-io/atelier' && github.ref == 'refs/heads/feat/v2-reconstruction-artifact-agents'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover uploaded source only if the platform has not already been imported
        env:
          RECOVERY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path.cwd()
          if (root / 'platform' / 'package.json').is_file():
              print('Existing platform present; no source is replaced.')
              raise SystemExit(0)
          repository = 'fragmatic-io/atelier'
          tree = '6e22664ce80aaf8baa67349731d5b3138b26eeb4'
          headers = {'Authorization': 'Bearer ' + os.environ['RECOVERY_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'Atelier-source-recovery'}
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/' + repository + '/' + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          snapshot = get('git/trees/' + tree + '?recursive=1')
          if snapshot.get('truncated'):
              raise RuntimeError('Incomplete tree response; refusing recovery.')
          entries = [item for item in snapshot['tree'] if item['path'].startswith('platform/') and item['type'] == 'blob']
          if not entries or len(entries) > 1500:
              raise RuntimeError('Missing or unexpectedly large platform tree.')
          if sum(item.get('size', 0) for item in entries) > 30000000:
              raise RuntimeError('Source snapshot exceeds recovery budget.')
          def recover(item):
              relative = pathlib.PurePosixPath(item['path'])
              if '..' in relative.parts or relative.is_absolute() or item['mode'] not in ('100644', '100755'):
                  raise RuntimeError('Unsafe source path or mode: ' + str(relative))
              if any(part in ('.git', 'node_modules') for part in relative.parts):
                  raise RuntimeError('Disallowed source directory: ' + str(relative))
              blob = get('git/blobs/' + item['sha'])
              if blob.get('encoding') != 'base64':
                  raise RuntimeError('Unexpected blob encoding.')
              data = base64.b64decode(blob['content'])
              git_hash = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              if git_hash != item['sha']:
                  raise RuntimeError('Source integrity mismatch: ' + str(relative))
              target = root / str(relative)
              if target.exists():
                  if target.read_bytes() != data:
                      raise RuntimeError('Refusing to overwrite an existing different file: ' + str(relative))
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o755 if item['mode'] == '100755' else 0o644)
              return {'path': str(relative), 'gitBlob': git_hash, 'sha256': hashlib.sha256(data).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              recovered = list(pool.map(recover, entries))
          audit = {'sourceTree': tree, 'files': recovered, 'classification': 'recovered upload checkpoint', 'productionCertified': False, 'acceptance': 'Tests must be executed on this recovered source; recovery alone is not a pass.'}
          (root / 'docs/v2-reconstruction/RECOVERED_SOURCE.json').write_text(json.dumps(audit, indent=2) + '\n')
          print('Integrity-checked source files recovered:', len(recovered))
          PY
      - name: Commit recovered readable source on the feature branch only
        env:
          RECOVERY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/v2-reconstruction-artifact-agents'
          if ! test -f docs/v2-reconstruction/RECOVERED_SOURCE.json; then exit 0; fi
          git config user.name 'Atelier reconstruction automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- platform docs/v2-reconstruction/RECOVERED_SOURCE.json
          if git diff --cached --quiet; then exit 0; fi
          git -c core.hooksPath=/dev/null commit -m 'feat: recover uploaded platform source with per-file integrity manifest'
          AUTH=$(printf 'x-access-token:%s' "$RECOVERY_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/v2-reconstruction-artifact-agents
          unset AUTH
