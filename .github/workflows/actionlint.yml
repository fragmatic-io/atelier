name: actionlint

# Triggers on push to main and on every pull_request that touches .github YAML.
# Dependabot PRs are intentionally IN scope: Dependabot opens PRs from in-repo
# branches, which fire `pull_request`, so its workflow-YAML mutations (e.g.
# action SHA bumps) get linted before merge. We deliberately do NOT use
# `pull_request_target` (which would expose secrets to fork code) and do NOT
# add an `if: github.actor != 'dependabot[bot]'` skip — letting Dependabot's
# YAML changes lint is the safer, more conservative default.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/**.yml'
      - '.github/**.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/**.yml'
      - '.github/**.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: rhysd/actionlint@v1.7.7
