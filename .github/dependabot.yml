version: 2

updates:
  - package-ecosystem: npm
    directory: /platform
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Kolkata
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    labels: [dependencies, ci]
